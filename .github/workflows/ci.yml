name: DIC scoring CI

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: test-only-ephemeral-key-000000000000000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'fastapi>=0.111,<1' 'uvicorn>=0.30,<1' 'pydantic>=2,<3' pytest
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q cli.py dic_istn.py agents enrichment.py simulator.py tests test_dic_istn.py
      - name: Run Python test suite
        run: python -m pytest -v
      - name: CLI scoring smoke test
        run: python cli.py overt --platelets 80 --fibrin-marker moderate_increase --pt-prolongation 4 --fibrinogen 0.9
      - name: JavaScript syntax and scoring tests
        run: |
          node --check web/scoring.js
          node --check web/app.js
          node --test web/scoring.test.cjs
